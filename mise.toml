[tools]
bun = "latest"
hk = "latest"
node = "22"
pkl = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@webosose/ares-cli" = "2.4.0"

[settings]
npm.package_manager = "bun"

[tasks.test]
description = "Run unit tests"
raw = true
run = "bun test"

[tasks.lint]
description = "Run Biome linter"
run = "biome lint ."

[tasks.format]
description = "Check Biome formatting"
run = "biome format ."

[tasks."format:fix"]
description = "Fix Biome formatting"
run = "biome format --write ."

[tasks.typecheck]
description = "Type-check with tsc"
run = "bunx tsc --noEmit"

[tasks.ci]
description = "Run all CI verification checks"
run = "mise test ::: lint ::: format ::: typecheck"

[tasks.build]
description = "Bundle the TV app into dist/"
run = "bun scripts/build.ts"

[tasks.sync-themes]
description = "Regenerate src/app/themes.generated.ts from pinned Omarchy themes"
run = "bun scripts/sync-themes.ts"

[tasks.make-icon]
description = "Regenerate public/icon.png and public/largeIcon.png"
run = "bun scripts/make-icon.ts"

[tasks.push]
description = "Collect omp usage and push it to the TV"
run = "bun src/collector/push.ts"

[tasks.serve]
description = "Preview dist/ on :3010"
run = "bun scripts/serve.ts"

[tasks.package]
depends = ["build"]
description = "Package dist/ into an IPK under build/"
run = "rm -rf build && mkdir build && ares-package -o build dist"

[tasks.deploy]
depends = ["package"]
description = "Install and launch Headroom on the TV, then push data"
run = """
bun scripts/tv.ts deploy
bun scripts/tv.ts launch
mise push
"""

[tasks.inspect]
description = "Forward the TV inspector (devtools on :9998)"
run = "bun scripts/tv.ts inspect"

[tasks.screenshot]
description = "Capture a 1920x1080 screenshot from the TV into docs/"
run = "bun scripts/tv.ts screenshot"

[tasks.main]
description = "Switch to main, pull, and clean up merged branches"
run = '''
set -e
git checkout main
git pull --rebase
git fetch --prune

cleaned=0
for branch in $(git branch -vv | grep ': gone]' | sed 's/^[*+] /  /' | awk '{print $1}'); do
  git branch -D "$branch"
  cleaned=$((cleaned + 1))
done

if [ "$cleaned" -gt 0 ]; then
  echo "Cleaned up ${cleaned} merged branch(es)"
else
  echo "No stale branches to clean up"
fi
'''
